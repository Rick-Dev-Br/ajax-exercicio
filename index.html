<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img id="avatar" class="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 id="nome" class="profile-name"></h1>
            <h2 id="username" class="profile-username"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repositorios"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" target="_blank" id="link" class="profile-link">Ver no Github</a>
        </div>
    </header>
    <script src="./jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(async function () {
            const profileAvatar = $('#avatar');
            const profileName = $('#nome');
            const profileUsername = $('#username');
            const profileLink = $('#link');
            const followers = $('#followers');
            const following = $('#following');
            const repositorios = $('#repositorios');

            try {
                // Faz a requisição à API
                const response = await fetch('https://api.github.com/users/Rick-Dev-Br');
                
                // Verifica se a resposta foi bem sucedida
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Erro ${response.status}: ${errorData.message || 'Falha na requisição'}`);
                }
                
                // Processa os dados
                const data = await response.json();
                
                profileAvatar.attr("src", data.avatar_url);
                profileName.text(data.name || data.login);  // Usa login se nome for nulo
                profileUsername.text(`@${data.login}`); 
                profileLink.attr('href', data.html_url);
                followers.text(data.followers);
                following.text(data.following);
                repositorios.text(data.public_repos);
                
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                
                // Mensagem amigável para o usuário
                profileName.text("Erro ao carregar");
                profileUsername.text("Tente recarregar a página");
                
                // Adiciona mensagem de erro no console e como alerta
                alert(`Erro: ${error.message}\nVerifique o console para mais detalhes`);
            }
        })
    </script>
</body>
</html>
